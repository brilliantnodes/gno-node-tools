# gno-node-tools config for an onyx-1 (gno.land testnet) node.
# Copy to /etc/gno-node-tools/onyx.ini. If you fill in [notify], make the file readable by the
# service user only: chmod 600 /etc/gno-node-tools/onyx.ini

[node]
chain_id = onyx-1
# The official upgrade ledger. A good copy is cached in <state_dir>/ledger-cache.json and used
# if GitHub cannot be reached at upgrade time.
ledger = https://raw.githubusercontent.com/gnolang/gno/chain/mainnet/misc/deployments/onyx.gno.land/upgrades.json
# Upgrades voted on chain but not yet in the official ledger (written by `install --pending`).
pending = /opt/gno/pending.json
# Binaries go to /opt/gno/versions/<tag>/, runner state to /opt/gno/state/.
root = /opt/gno
# The node's working directory: gnoland-data/ (config, secrets, db) lives inside it.
home = /var/lib/gnoland
genesis = /var/lib/gnoland/genesis.json
genesis_url = https://github.com/gnolang/gno/releases/download/chain/onyx/genesis.json
rpc = http://127.0.0.1:26657
# Onyx requires --skip-genesis-sig-verification (misc/deployments/onyx.gno.land/VALIDATOR.md, section 4).
start_args = --chainid {chain_id} --genesis {genesis} --skip-genesis-sig-verification
# Joining from genesis, as onyx's UPGRADES.md says (verified upstream on 2026-11-17):
# v1.7.1-rc.1 replays every block up to v1.8.0-rc.1's halt, then v1.8.0-rc.1.
# Upgrades after that follow the ledger (and the pending file) automatically.
plan = 1:v1.7.1-rc.1, 1203401:v1.8.0-rc.1

[runner]
poll_seconds = 5
halt_grace_seconds = 20
halt_stall_seconds = 60
stop_timeout_seconds = 90

[watch]
# A node you do not run, to tell "my node is behind" from "the whole network stopped".
reference_rpc = https://rpc.onyx.testnets.gno.land
service = gno-node
confirm_checks = 3
stall_minutes = 15
max_lag_blocks = 30
min_peers = 3
disk_percent = 90
repeat_hours = 12

[notify]
# Fill in one or more. Alerts go out only for confirmed problems.
telegram_bot_token =
telegram_chat_id =
discord_webhook =
webhook_url =
prefix = [onyx]
