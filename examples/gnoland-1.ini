# gno-node-tools config for a gnoland-1 (gno.land mainnet) node.
# Not yet run by the authors on mainnet; check every value against
# misc/deployments/mainnet.gno.land/VALIDATOR.md before use.
# chmod 600 this file if you fill in [notify].

[node]
chain_id = gnoland-1
ledger = https://raw.githubusercontent.com/gnolang/gno/chain/mainnet/misc/deployments/mainnet.gno.land/upgrades.json
pending = /opt/gno/pending.json
root = /opt/gno
home = /var/lib/gnoland
genesis = /var/lib/gnoland/genesis.json
# Set genesis_url to the download link given in mainnet.gno.land/VALIDATOR.md; the file is
# checked against genesis_sha256 in the ledger either way.
genesis_url =
rpc = http://127.0.0.1:26657
start_args = --chainid {chain_id} --genesis {genesis} --skip-genesis-sig-verification
# Joining from genesis, as mainnet's UPGRADES.md says (v1.7.1 alone replays gnoland-1 from
# genesis; verified upstream on 2026-11-13), then v1.8.0 from its halt.
plan = 1:v1.7.1, 1651501:v1.8.0

[watch]
reference_rpc =
service = gno-node

[notify]
telegram_bot_token =
telegram_chat_id =
discord_webhook =
webhook_url =
prefix = [gnoland-1]
