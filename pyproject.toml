[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gno-node-tools"
version = "0.2.0"
description = "Run a gno.land node through its coordinated upgrades, check it, and alert only when something is wrong."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.scripts]
gno-tools = "gnotools.__main__:main"

[tool.setuptools]
packages = ["gnotools"]
